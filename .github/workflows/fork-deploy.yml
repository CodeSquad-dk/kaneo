name: Fork Deploy

on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: kaneo-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/codesquad-dk/kaneo
  ARGOCD_APP: clu1-kaneo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.kaneo
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retag with short sha
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${GITHUB_SHA::8}" \
            "$IMAGE:$GITHUB_SHA"

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      ARGOCD_SERVER: argocd.codesquad.dk
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      ARGOCD_OPTS: --grpc-web
    steps:
      - name: Install argocd CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Wait for ApplicationSet to pick up this commit
        run: |
          for i in $(seq 1 60); do
            CURRENT=$(argocd app get "$ARGOCD_APP" -o json | jq -r '.spec.sources[0].targetRevision')
            if [ "$CURRENT" = "$GITHUB_SHA" ]; then
              echo "ApplicationSet is on $GITHUB_SHA"
              break
            fi
            echo "still on $CURRENT, waiting..."
            sleep 5
          done
          if [ "$CURRENT" != "$GITHUB_SHA" ]; then
            echo "::error::ApplicationSet did not update to $GITHUB_SHA within 5 minutes"
            exit 1
          fi

      - name: Sync
        run: |
          argocd app sync "$ARGOCD_APP" --prune
          argocd app wait "$ARGOCD_APP" --health --sync --timeout 300
